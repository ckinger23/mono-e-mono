# fly.toml - Fly.io configuration for Mono-e-Mono

app = "mono-e-mono"
primary_region = "ord"  # Chicago - central US

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  ENV = "production"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 80

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

# Database is attached separately via:
# fly postgres create --name mono-e-mono-db
# fly postgres attach mono-e-mono-db

# Secrets to set:
# fly secrets set JWT_SECRET="your-secret-here"
# fly secrets set GOOGLE_CLIENT_ID="your-google-client-id"
# fly secrets set GOOGLE_CLIENT_SECRET="your-google-secret"
# fly secrets set GITHUB_CLIENT_ID="your-github-client-id"
# fly secrets set GITHUB_CLIENT_SECRET="your-github-secret"
# fly secrets set FRONTEND_URL="https://your-frontend-url.com"
