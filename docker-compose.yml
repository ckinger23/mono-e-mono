version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: mono-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mono_e_mono
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./internal/db/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mono-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend API server (for local development with Docker)
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mono-api
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/mono_e_mono?sslmode=disable
      - PORT=8080
      - ENV=development
      - FRONTEND_URL=http://localhost:3000
      - JWT_SECRET=development-secret-change-in-production-at-least-32-chars
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - full  # Only start with: docker compose --profile full up

volumes:
  postgres_data:
  redis_data:
